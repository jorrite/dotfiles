# herdr configuration
# Full set of available options: `herdr --default-config`
#
# Left mostly at defaults intentionally. Add keybindings here as plugins
# get installed (`herdr plugin install owner/repo`) -- installed plugins
# are tracked globally by herdr itself, not in this file, but binding a
# key to a plugin action goes here, e.g.:
#
# [[keys.command]]
# key = "prefix+l"
# type = "plugin_action"
# command = "example.layout.apply"

# Suppresses the first-run onboarding wizard permanently -- without this,
# a plain chezmoi-managed config.toml gets reset to a version lacking
# herdr's own runtime-written `onboarding = false`, bringing the wizard
# back on every `chezmoi apply`.
onboarding = false

[keys]
# Hyper+H (Caps Lock, remapped to right_shift+right_control+right_option+
# right_command via Karabiner, held with "h") as the prefix instead of the
# default ctrl+b -- nothing else on this machine uses that chord. Relies on
# Warp's Kitty-keyboard-protocol support to forward the full modifier
# combination through to herdr; if it doesn't register, fall back to
# remapping Hyper+H to a plain "ctrl+alt+h" chord in Karabiner instead,
# which herdr's own docs call out as the most reliable option on macOS.
prefix = "ctrl+alt+cmd+shift+h"

# herdr-projects popup, normally added by `herdr-projects configure`. Kept
# here instead so it survives `chezmoi apply` -- run `herdr-projects
# configure --hooks-only` after installing the plugin to set up its Claude
# Code hooks/skill without letting it also write to this file.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr-projects.open-popup"
description = "Projects"

[worktrees]
directory = "~/.herdr/worktrees"

[terminal]
# Pin every new pane to fish regardless of $SHELL, so the `claude` fish
# function (dot_config/fish/functions/claude.fish) -- which redirects to
# cs-launch's nono sandbox whenever $HERDR_ENV is set -- always applies,
# including to panes herdr's own daemon spawns for herdr-projects threads
# and coordinators (confirmed via testing: `herdr agent start` types the
# command into the pane's actual interactive shell rather than spawning it
# server-side, so this is shell-, not daemon-, scoped).
default_shell = "fish"

[ui]
# herdr-projects' tab-bar "needs attention" indicator. Routed through the
# herdr-projects-status wrapper (dot_local/bin/executable_herdr-projects-status)
# instead of the raw binary path `herdr-projects configure` would normally
# write here, since that path is hash-suffixed and changes on every
# plugin reinstall/update -- the wrapper resolves the current path at call
# time instead of baking a stale one into this file.
tab_bar_right = [{ type = "command", command = "herdr-projects-status --line", interval_seconds = 15, timeout_seconds = 5 }]

[ui.sidebar.agents]
rows = [["state_icon", { token = "agent", bold = false, dim = false, rules = [{ contains = "​", bold = true }] }, "state_text"], [{ token = "$hp_sub", dim = true }]]

[ui.sidebar.spaces]
rows = [["state_icon", { token = "workspace", rules = [{ contains = "⠀", bold = true }] }, { token = "branch", dim = true }, "git_status"]]
