# herdr configuration
# Full set of available options: `herdr --default-config`
#
# Left mostly at defaults intentionally. Add keybindings here as plugins
# get installed (`herdr plugin install owner/repo`) -- installed plugins
# are tracked globally by herdr itself, not in this file, but binding a
# key to a plugin action goes here, e.g.:
#
# [[keys.command]]
# key = "prefix+l"
# type = "plugin_action"
# command = "example.layout.apply"

# Suppresses the first-run onboarding wizard permanently -- without this,
# a plain chezmoi-managed config.toml gets reset to a version lacking
# herdr's own runtime-written `onboarding = false`, bringing the wizard
# back on every `chezmoi apply`.
onboarding = false

[keys]
# Hyper+H (Caps Lock, remapped to right_shift+right_control+right_option+
# right_command via Karabiner, held with "h") as the prefix instead of the
# default ctrl+b -- nothing else on this machine uses that chord. Relies on
# Warp's Kitty-keyboard-protocol support to forward the full modifier
# combination through to herdr; if it doesn't register, fall back to
# remapping Hyper+H to a plain "ctrl+alt+h" chord in Karabiner instead,
# which herdr's own docs call out as the most reliable option on macOS.
prefix = "ctrl+alt+cmd+shift+h"

[worktrees]
directory = "~/.herdr/worktrees"

[terminal]
# Pin every new pane to fish regardless of $SHELL, so the `claude` fish
# function (dot_config/fish/functions/claude.fish, which redirects into
# cs-launch's sandbox) always applies, including to panes herdr's own
# daemon spawns for herdr-projects threads and coordinators (confirmed via
# testing: `herdr agent start` types the command into the pane's actual
# interactive shell rather than spawning it server-side, so this is
# shell-, not daemon-, scoped).
default_shell = "fish"

[ui.toast]
# Desktop notifications for background agent state (done / needs input),
# via the outer terminal instead of herdr's own in-app toast or the OS's
# notification service -- also keeps working when attached over SSH.
delivery = "terminal"

# >>> herdr-projects key (added by the herdr-projects plugin; `herdr-projects remove-extras` removes it)
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr-projects.open"
description = "work board"
# <<< herdr-projects key

# >>> herdr-projects sidebar (added by the herdr-projects plugin; `herdr-projects remove-extras` removes it)
[ui.sidebar.agents]
rows = [["state_icon", "machine", "workspace", { token = "tab", rules = [{ equals = "Agent", hide = true }, { starts_with = "Reviewer #", hide = true }] }], ["agent"], [{ token = "$summary", dim = true }, "$progress"]]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"], [{ token = "$summary", dim = true }, "$progress"]]
# <<< herdr-projects sidebar
