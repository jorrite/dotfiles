config-version = 2

after-startup-command = []

# launched/quit by a per-machine Focus automation instead.
start-at-login = false

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 8

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

on-focus-changed = ['move-mouse window-lazy-center']

automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ["1", "2", "3", "4", "5"]

on-mode-changed = []

# Plain keys must stay above this array-of-tables section (TOML gotcha).

[[on-window-detected]]
    if.app-id = 'com.apple.MobileSMS'
    run = 'move-node-to-workspace 1'
[[on-window-detected]]
    if.app-id = 'com.tinyspeck.slackmacgap'
    run = 'move-node-to-workspace 1'
[[on-window-detected]]
    if.app-id = 'com.microsoft.teams2'
    run = 'move-node-to-workspace 1'
[[on-window-detected]]
    if.app-id = 'com.microsoft.teams'
    run = 'move-node-to-workspace 1'
[[on-window-detected]]
    if.app-id = 'net.whatsapp.WhatsApp'
    run = 'move-node-to-workspace 1'
[[on-window-detected]]
    if.app-id = 'com.apple.mail'
    run = 'move-node-to-workspace 1'
[[on-window-detected]]
    if.app-id = 'com.microsoft.Outlook'
    run = 'move-node-to-workspace 1'

[[on-window-detected]]
    if.app-id = 'com.apple.Safari'
    run = 'move-node-to-workspace 2'
[[on-window-detected]]
    if.app-id = 'com.google.Chrome'
    run = 'move-node-to-workspace 2'

[[on-window-detected]]
    if.app-id = 'dev.warp.Warp-Stable'
    run = 'move-node-to-workspace 3'

[[on-window-detected]]
    if.app-id = 'dev.zed.Zed'
    run = 'move-node-to-workspace 4'

# Order matters below: first match wins.

[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.1password.1password'
    if.window-title-regex-substring = ' — 1Password'
    run = 'move-node-to-workspace 5'
[[on-window-detected]]
    if.app-id = 'com.1password.1password'
    run = 'layout floating'

# Must be last: catch-all for everything else.
[[on-window-detected]]
    run = 'move-node-to-workspace 5'

[key-mapping]
    preset = 'qwerty'

[workspace-to-monitor-force-assignment]
    4 = 'secondary'
    5 = 'secondary'

[gaps]
    inner.horizontal = 8
    inner.vertical =   8
    outer.left =       8
    outer.bottom =     8
    outer.top =        8
    outer.right =      8

# Intentionally empty: bindings live in Karabiner instead.
[mode.main.binding]
